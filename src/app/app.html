<app-header />

<header class="page-header">
  <div class="header-content">
    <div class="header-text">
      <h1>Agenda de Eventos</h1>
      <p>Descubra eventos de tecnologia, educação e carreira</p>
    </div>
    <div class="header-actions">
      @if (usuarioLogado) {
        <span class="user-greeting">Bem-vindo, usuário!</span>
      } @else {
        <span class="login-hint">Faça login para inscrições rápidas</span>
      }
      <button class="btn-login" (click)="alternarLogin()">
        {{ usuarioLogado ? 'Sair' : 'Login' }}
      </button>
    </div>
  </div>
</header>

<main class="page-main">
  <section class="events-section">
    <div class="section-header">
      <h2>Próximos Eventos</h2>
      <p>Encontre o evento ideal para você</p>
    </div>

    <div class="events-grid">
      @for (evento of eventos; track evento.id) {
        <app-event-card
          [evento]="evento"
          (detalhes)="verDetalhes($event)"
        />
      }
    </div>
  </section>

  <app-event-detail
    [evento]="eventoSelecionado"
    [visivel]="!!eventoSelecionado"
    (fechar)="fecharDetalhes()"
  />
</main>

<app-footer />
